<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Empty Throne — Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Spectral:wght@400;500;600&display=swap');

:root{
  --bg:#131019;
  --panel:#1E1A29;
  --panel-2:#241F33;
  --ink:#ECE6D6;
  --ink-dim:#B8AF9C;
  --gold:#C9A227;
  --gold-dim:#8a7527;
  --line:#33304a;
  --parchment:#EDE3CE;
  --parchment-ink:#2B2410;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(ellipse at top, #1c1830 0%, var(--bg) 55%);
  color:var(--ink);
  font-family:'Spectral',serif;
  min-height:100vh;
}
h1,h2,h3,.display{ font-family:'Cinzel',serif; letter-spacing:.03em; }
#app{ max-width:1100px; margin:0 auto; padding:20px 16px 60px; }

.header{ text-align:center; margin-bottom:18px; }
.header h1{ font-size:2.1rem; color:var(--gold); margin:0 0 4px; text-transform:uppercase; letter-spacing:.12em; }
.header .sub{ color:var(--ink-dim); font-size:.85rem; letter-spacing:.05em; }

.layout{ display:grid; grid-template-columns: 1fr 300px; gap:18px; align-items:start; }
@media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

.board{ display:flex; flex-direction:column; gap:14px; }
.zone{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
.zone-title{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.zone-title .name{ font-family:'Cinzel',serif; font-size:.95rem; color:var(--gold); letter-spacing:.05em; }
.zone-title .status{ font-size:.75rem; color:var(--ink-dim); }
.shield-badge{ display:inline-block; background:#2b3f66; color:#a9c6ff; border:1px solid #3c5a8f; border-radius:999px; padding:2px 9px; font-size:.7rem; margin-left:8px; }

.hand{ display:flex; gap:10px; flex-wrap:wrap; }
.card{
  width:96px; min-height:130px; border-radius:8px; padding:8px 8px 10px;
  background:linear-gradient(160deg,var(--parchment),#e2d5b2);
  color:var(--parchment-ink); border:2px solid var(--accent,#8a7527);
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}
.card .card-rank{ font-family:'Cinzel',serif; font-size:1.3rem; font-weight:700; color:var(--accent,#8a7527); }
.card .card-name{ font-family:'Cinzel',serif; font-size:.72rem; font-weight:600; line-height:1.15; margin-top:2px; }
.card .card-tag{ font-size:.62rem; font-style:italic; opacity:.75; margin-top:6px; line-height:1.2; }
.card.back{ align-items:center; justify-content:center; background:linear-gradient(160deg,#2a2440,#181425); border-color:#4a4270; }
.card.back span{ font-family:'Cinzel',serif; color:var(--gold-dim); font-size:1.6rem; }
.card.clickable{ cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
.card.clickable:hover{ transform:translateY(-5px); box-shadow:0 8px 18px rgba(0,0,0,.45); }
.card.disabled{ opacity:.45; filter:grayscale(.4); cursor:not-allowed; }
.card.disabled:hover{ transform:none; }

.center-row{ display:flex; gap:14px; }
.pile{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; flex:1; text-align:center; }
.pile .big{ font-family:'Cinzel',serif; font-size:1.6rem; color:var(--gold); }
.pile .label{ font-size:.72rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }
.discard-strip{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; justify-content:center; }
.discard-strip .mini{ width:30px; height:40px; border-radius:4px; background:var(--parchment); border:1px solid var(--accent,#8a7527); color:var(--parchment-ink); font-family:'Cinzel',serif; font-weight:700; font-size:.85rem; display:flex; align-items:center; justify-content:center; }

.action-panel{ background:var(--panel); border:1px solid var(--gold-dim); border-radius:10px; padding:16px; min-height:70px; }
.action-panel .prompt{ font-family:'Cinzel',serif; color:var(--gold); font-size:.9rem; margin-bottom:10px; letter-spacing:.03em; }
.btn{
  background:linear-gradient(160deg,#3a3355,#241f38); color:var(--ink); border:1px solid var(--gold-dim);
  border-radius:6px; padding:9px 16px; font-family:'Spectral',serif; font-size:.9rem; cursor:pointer; margin:3px 6px 3px 0;
}
.btn:hover{ border-color:var(--gold); color:#fff; }
.btn.primary{ background:linear-gradient(160deg,var(--gold),#93791e); color:#201a08; font-weight:600; border:none;}
.btn.primary:hover{ filter:brightness(1.08); }
.rank-grid{ display:flex; flex-wrap:wrap; gap:6px; }
.rank-btn{ width:44px; height:44px; border-radius:6px; border:1px solid var(--gold-dim); background:var(--panel-2); color:var(--ink); font-family:'Cinzel',serif; font-size:1rem; cursor:pointer; }
.rank-btn:hover{ border-color:var(--gold); color:var(--gold); }

.sidebar{ display:flex; flex-direction:column; gap:14px; }
.log-box{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; max-height:340px; overflow-y:auto; font-size:.82rem; }
.log-box .entry{ padding:5px 0; border-bottom:1px dashed var(--line); color:var(--ink-dim); line-height:1.4; }
.log-box .entry:first-child{ color:var(--ink); }
.log-title{ font-family:'Cinzel',serif; color:var(--gold); font-size:.85rem; margin-bottom:8px; letter-spacing:.05em; }

.ref-toggle{ width:100%; text-align:left; }
.ref-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.ref-item{ display:flex; gap:10px; align-items:flex-start; border-left:3px solid var(--accent); padding-left:8px; }
.ref-item .r{ font-family:'Cinzel',serif; font-weight:700; color:var(--accent); width:20px; }
.ref-item .t{ font-size:.78rem; line-height:1.35; }
.ref-item .t b{ color:var(--ink); }
.ref-item .t span{ color:var(--ink-dim); display:block; font-size:.72rem; margin-top:1px;}

.gameover{ text-align:center; padding:16px; }
.gameover h2{ color:var(--gold); font-size:1.3rem; margin-bottom:8px; }

.note{ font-size:.72rem; color:var(--ink-dim); text-align:center; margin-top:18px; line-height:1.5; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Card definitions ---------- */
const CARD_DEFS = {
  1:{ name:'The Herald', copies:2, tag:'Uprising', accent:'#8B8FA3',
      desc:'The 1st copy played does nothing. When the 2nd copy is played by anyone, that player immediately enacts the Regent\’s Trial.' },
  2:{ name:'The Informant', copies:2, tag:'Whispered Accusation', accent:'#4C8A5E',
      desc:'Name a rank (2–10) for the opponent\’s hand card. Correct guess eliminates them.' },
  3:{ name:'The Oracle', copies:2, tag:'Foresight', accent:'#8A63C9',
      desc:'Privately view the opponent\’s hand card.' },
  4:{ name:'The Warden', copies:2, tag:'Standing Guard', accent:'#4E86C9',
      desc:'You are immune to all targeted effects until your next turn.' },
  5:{ name:'The Plague Doctor', copies:2, tag:'Quarantine', accent:'#6E8A4A',
      desc:'Opponent draws a card, then you blindly choose one of their two cards to force discarded.' },
  6:{ name:'The Blade Marshal', copies:2, tag:'Formal Duel', accent:'#B23A44',
      desc:'Secretly compare hand cards with the opponent. Lower rank is eliminated.' },
  7:{ name:'The Archivist', copies:2, tag:'Sealed Record', accent:'#C08A2E',
      desc:'On your next turn, draw 3, keep 1, and return the other 2 to the top of the case.' },
  8:{ name:'The Enchantress', copies:2, tag:'Binding Exchange', accent:'#B14F97',
      desc:'Swap your hand card with the opponent\’s.' },
  9:{ name:'The Regent', copies:1, tag:'Trial by Court', accent:'#D9B23A',
      desc:'Opponent draws a card and reveals both to you. You choose which they discard. The only effect that permanently removes the Exiled Heir.' },
  10:{ name:'The Exiled Heir', copies:1, tag:'Bloodline in Hiding', accent:'#EDE3CE',
      desc:'Cannot be played normally. If forced to discard by anything except the Regent\’s Trial, you draw the Sanctuary card instead and remain in the game.' },
};
const SANCTUARY_DEF = { name:'Sanctuary', tag:'Safehouse Identity', accent:'#9C9686', desc:'No special ability. A quiet place to hide.' };
function defFor(rank){ return rank===0 ? SANCTUARY_DEF : CARD_DEFS[rank]; }
function powerScore(rank){ return ({1:1,2:3,3:2,4:2,5:3,6:4,7:4,8:5,9:8,10:9})[rank] || 0; }

/* ---------- State ---------- */
let state = null;

function uid(){ return Math.random().toString(36).slice(2,9); }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function buildDeck(){
  let d=[];
  for(const rank in CARD_DEFS){ const def=CARD_DEFS[rank]; for(let i=0;i<def.copies;i++) d.push({uid:uid(),rank:Number(rank)}); }
  return d;
}
function opponentOf(p){ return p==='human'?'ai':'human'; }
function log(msg){ state.log.unshift(msg); if(state.log.length>80) state.log.pop(); }

function initGame(){
  state = {
    deck: shuffle(buildDeck()),
    discard: [],
    sanctuary: null,
    players: {
      human: { name:'You', hand:[], protected:false, eliminated:false, pendingArchivist:false },
      ai: { name:'The Rival Claimant', hand:[], protected:false, eliminated:false, pendingArchivist:false }
    },
    turn:'human',
    heraldCount:0,
    log:[],
    pending:{type:'none'},
    gameOver:false,
    aiKnowledge:{ humanRank:null },
    showRef:false
  };
  state.players.human.hand.push(state.deck.pop());
  state.players.ai.hand.push(state.deck.pop());
  state.sanctuary = state.deck.pop();
  log('The dispatch case is sealed. The game begins — ' + state.deck.length + ' letters remain.');
  render();
  startTurn('human');
}

/* ---------- Turn flow ---------- */
function startTurn(p){
  if(state.gameOver) return;
  const player = state.players[p];
  player.protected = false;
  state.turn = p;
  if(state.deck.length===0){ endByComparison(); return; }
  if(player.pendingArchivist){
    player.pendingArchivist = false;
    doArchivistDraw(p);
    return;
  }
  const card = state.deck.pop();
  player.hand.push(card);
  log(`${player.name} draws a letter. (${state.deck.length} left in the case)`);
  if(p==='human'){ state.pending={type:'chooseCard'}; render(); }
  else { render(); setTimeout(aiChooseAndPlay, 850); }
}

function doArchivistDraw(p){
  const player = state.players[p];
  const n = Math.min(3, state.deck.length);
  if(n===0){ log(`${player.name}'s Sealed Record finds the case empty.`); endByComparison(); return; }
  let drawn=[]; for(let i=0;i<n;i++) drawn.push(state.deck.pop());
  log(`${player.name} invokes the Sealed Record, drawing ${n} letter(s).`);
  if(p==='human'){ state.pending={type:'archivistKeep', drawn}; render(); return; }
  drawn.sort((a,b)=>powerScore(b.rank)-powerScore(a.rank));
  const keep = drawn[0]; const rest = drawn.slice(1);
  player.hand.push(keep);
  for(const c of rest) state.deck.push(c);
  log(`${player.name} keeps one letter and returns the rest to the top of the case.`);
  render();
  setTimeout(aiChooseAndPlay, 850);
}

function confirmArchivistKeep(theUid){
  if(state.pending.type!=='archivistKeep') return;
  const drawn = state.pending.drawn;
  const keepIdx = drawn.findIndex(c=>c.uid===theUid);
  if(keepIdx<0) return;
  const keep = drawn[keepIdx];
  const rest = drawn.filter((c,i)=>i!==keepIdx);
  state.players.human.hand.push(keep);
  for(const c of rest) state.deck.push(c);
  log(`You keep ${defFor(keep.rank).name} (${keep.rank}) and return the rest to the top of the case.`);
  state.pending={type:'chooseCard'};
  render();
}

function chooseCard(idx){
  if(state.turn!=='human' || state.pending.type!=='chooseCard') return;
  const hand = state.players.human.hand;
  if(hand[idx].rank===10 && hand.length>1) return; // Heir can't be played normally
  playCard('human', idx);
}

function aiChooseAndPlay(){
  if(state.gameOver) return;
  const hand = state.players.ai.hand;
  let idxs = hand.map((c,i)=>i).filter(i=>hand[i].rank!==10);
  if(idxs.length===0) idxs = hand.map((c,i)=>i);
  idxs.sort((a,b)=>powerScore(hand[a].rank)-powerScore(hand[b].rank));
  playCard('ai', idxs[0]);
}

function playCard(p, idx){
  const player = state.players[p];
  const card = player.hand.splice(idx,1)[0];
  state.discard.push(card);
  const def = defFor(card.rank);
  log(`${player.name} plays ${def.name} (${card.rank}) — "${def.tag}"`);
  state.pending = {type:'none'};
  resolveAbility(p, card);
}

/* ---------- Abilities ---------- */
function resolveAbility(p, card){
  const player = state.players[p], opp = opponentOf(p), oppPlayer = state.players[opp];
  switch(card.rank){
    case 1: {
      state.heraldCount++;
      if(state.heraldCount>=2){
        log(`The second Herald ignites an Uprising! ${player.name} enacts the Regent's Trial.`);
        beginRegentTrial(p, opp);
        return;
      }
      log('The people watch and wait. Nothing happens... yet.');
      finishAbility();
      return;
    }
    case 2: {
      if(oppPlayer.protected){ log(`${oppPlayer.name} is shielded by the Warden — the accusation cannot be made.`); finishAbility(); return; }
      if(p==='human'){ state.pending={type:'informantGuess'}; render(); return; }
      resolveInformantGuess('ai', aiGuessRank());
      return;
    }
    case 3: {
      if(oppPlayer.protected){ log(`${oppPlayer.name} is shielded by the Warden — Foresight fails.`); finishAbility(); return; }
      const seen = oppPlayer.hand[0];
      if(p==='human'){ log(`Foresight reveals: ${oppPlayer.name} holds ${defFor(seen.rank).name} (${seen.rank}).`); }
      else { state.aiKnowledge.humanRank = seen.rank; log(`${player.name} peers into your letter... and says nothing.`); }
      finishAbility();
      return;
    }
    case 4: {
      player.protected = true;
      log(`${player.name} stands under the Warden's guard.`);
      finishAbility();
      return;
    }
    case 5: {
      if(oppPlayer.protected){ log(`${oppPlayer.name} is shielded by the Warden — the Quarantine fails.`); finishAbility(); return; }
      if(state.deck.length===0){ log('The case is empty — the Quarantine has no effect.'); finishAbility(); return; }
      const drawn = state.deck.pop(); oppPlayer.hand.push(drawn);
      log(`${oppPlayer.name} is forced to draw for the Quarantine.`);
      if(p==='human'){ state.pending={type:'blindPick', target:opp}; render(); return; }
      resolveBlindPick('ai', opp, Math.floor(Math.random()*2));
      return;
    }
    case 6: {
      if(oppPlayer.protected){ log(`${oppPlayer.name} is shielded by the Warden — the Duel is refused.`); finishAbility(); return; }
      const mine = player.hand[0], theirs = oppPlayer.hand[0];
      log(`${player.name} calls a Formal Duel!`);
      if(mine.rank===theirs.rank){ log('Both reveal the same rank — a stalemate. No one falls.'); }
      else if(mine.rank>theirs.rank){ eliminate(opp, `${oppPlayer.name}'s ${defFor(theirs.rank).name} falls to ${player.name}'s ${defFor(mine.rank).name}.`); }
      else { eliminate(p, `${player.name}'s ${defFor(mine.rank).name} falls to ${oppPlayer.name}'s ${defFor(theirs.rank).name}.`); }
      finishAbility();
      return;
    }
    case 7: {
      player.pendingArchivist = true;
      log(`${player.name} seals a Record — extra letters await on their next turn.`);
      finishAbility();
      return;
    }
    case 8: {
      if(oppPlayer.protected){ log(`${oppPlayer.name} is shielded by the Warden — the Exchange fails.`); finishAbility(); return; }
      const mine = player.hand[0], theirs = oppPlayer.hand[0];
      player.hand[0] = theirs; oppPlayer.hand[0] = mine;
      log(`${player.name} performs a Binding Exchange with ${oppPlayer.name}.`);
      if(p==='ai') state.aiKnowledge.humanRank = null;
      finishAbility();
      return;
    }
    case 9: {
      beginRegentTrial(p, opp);
      return;
    }
    default: {
      finishAbility();
      return;
    }
  }
}

function beginRegentTrial(actor, target){
  const targetP = state.players[target];
  if(targetP.protected){ log(`${targetP.name} is shielded by the Warden — the Trial cannot proceed.`); finishAbility(); return; }
  if(state.deck.length===0){ log('The case is empty — the Trial cannot proceed.'); finishAbility(); return; }
  const drawn = state.deck.pop();
  targetP.hand.push(drawn);
  log(`${targetP.name} draws for the Trial and must reveal both letters.`);
  if(actor==='human'){ state.pending = {type:'regentChoice', target}; render(); return; }
  const opts = targetP.hand;
  const heirIdx = opts.findIndex(c=>c.rank===10);
  const chooseIdx = heirIdx>=0 ? heirIdx : (powerScore(opts[0].rank) >= powerScore(opts[1].rank) ? 0 : 1);
  resolveRegentDiscard(target, chooseIdx);
}

function resolveRegentDiscard(target, idx){
  const targetP = state.players[target];
  const card = targetP.hand.splice(idx,1)[0];
  state.discard.push(card);
  if(card.rank===10){ log(`The Exiled Heir is exposed and cast out by the Trial — no reincarnation can save it now.`); }
  else { log(`${targetP.name} is forced to discard ${defFor(card.rank).name} (${card.rank}).`); }
  finishAbility();
}

function resolveBlindPick(actor, target, idx){
  const targetP = state.players[target];
  const card = targetP.hand[idx];
  if(card.rank===10){
    targetP.hand.splice(idx,1);
    targetP.hand.push(state.sanctuary);
    state.sanctuary = card;
    log(`${targetP.name} reveals... the Exiled Heir! Reincarnation triggers — they draw the Sanctuary card and remain in the game.`);
  } else {
    targetP.hand.splice(idx,1);
    state.discard.push(card);
    log(`${targetP.name} was forced to discard ${defFor(card.rank).name} (${card.rank}), chosen blindly.`);
  }
  finishAbility();
}

function resolveInformantGuess(actor, guessRank){
  const target = opponentOf(actor);
  const targetP = state.players[target], actorP = state.players[actor];
  const actualRank = targetP.hand[0].rank;
  log(`${actorP.name} accuses: "You hold ${defFor(guessRank).name}!"`);
  if(guessRank === actualRank){ eliminate(target, `The accusation is true — ${targetP.name} is exposed and eliminated!`); }
  else { log(`Wrong — ${targetP.name} breathes easy.`); }
  finishAbility();
}

function aiGuessRank(){
  if(state.aiKnowledge.humanRank && state.aiKnowledge.humanRank>=2) return state.aiKnowledge.humanRank;
  const counts={};
  for(let r=2;r<=10;r++) counts[r]=CARD_DEFS[r].copies;
  for(const c of state.discard) if(counts[c.rank]!==undefined) counts[c.rank]--;
  for(const c of state.players.ai.hand) if(counts[c.rank]!==undefined) counts[c.rank]--;
  let pool=[];
  for(let r=2;r<=10;r++) for(let i=0;i<Math.max(counts[r],0);i++) pool.push(r);
  if(pool.length===0) return 2;
  return pool[Math.floor(Math.random()*pool.length)];
}

function eliminate(p, msg){ state.players[p].eliminated = true; log(msg); checkGameEnd(); }

function checkGameEnd(){
  const h=state.players.human, a=state.players.ai;
  if(h.eliminated && !a.eliminated) endGame(`${a.name} wins — you were eliminated.`);
  else if(a.eliminated && !h.eliminated) endGame(`You win! ${a.name} has been eliminated.`);
  else if(h.eliminated && a.eliminated) endGame(`Both claimants fall — the throne remains empty. It's a draw.`);
}

function endByComparison(){
  const h=state.players.human, a=state.players.ai;
  log('The dispatch case is empty. Remaining claimants reveal their final letters.');
  const hc=h.hand[0], ac=a.hand[0];
  log(`You hold ${defFor(hc.rank).name} (${hc.rank}). ${a.name} holds ${defFor(ac.rank).name} (${ac.rank}).`);
  if(hc.rank>ac.rank) endGame('Your higher standing wins you the throne!');
  else if(ac.rank>hc.rank) endGame(`${a.name}'s higher standing claims the throne.`);
  else endGame('A perfect tie in standing — the throne remains empty. It\’s a draw.');
}

function endGame(msg){ state.gameOver = true; log(msg); render(); }

function finishAbility(){
  state.pending = {type:'none'};
  if(state.gameOver){ render(); return; }
  const next = opponentOf(state.turn);
  render();
  setTimeout(()=>startTurn(next), state.turn==='human' ? 550 : 900);
}

function toggleRef(){ state.showRef = !state.showRef; render(); }

/* ---------- Render ---------- */
function render(){
  const app = document.getElementById('app');
  const h = state.players.human, a = state.players.ai;

  const aiHandHTML = a.hand.map(()=>`<div class="card back"><span>?</span></div>`).join('');
  const humanHandHTML = h.hand.map((c,i)=>{
    const def = defFor(c.rank);
    const isChooseStep = state.turn==='human' && state.pending.type==='chooseCard';
    const isHeirBlocked = c.rank===10 && h.hand.length>1;
    const clickable = isChooseStep && !isHeirBlocked;
    return `<div class="card ${clickable?'clickable':''} ${isChooseStep && isHeirBlocked?'disabled':''}" style="--accent:${def.accent}" ${clickable?`onclick="chooseCard(${i})"`:''}>
      <div class="card-rank">${c.rank}</div>
      <div class="card-name">${def.name}</div>
      <div class="card-tag">${def.tag}${isHeirBlocked?' — cannot be played':''}</div>
    </div>`;
  }).join('');

  const discardHTML = state.discard.slice().reverse().map(c=>{
    const def=defFor(c.rank);
    return `<div class="mini" style="--accent:${def.accent}" title="${def.name}">${c.rank}</div>`;
  }).join('');

  let actionHTML = '';
  if(state.gameOver){
    actionHTML = `<div class="gameover"><h2>${state.log[0]}</h2><button class="btn primary" onclick="initGame()">Play Again</button></div>`;
  } else if(state.turn!=='human'){
    actionHTML = `<div class="prompt">${a.name} is deciding...</div>`;
  } else if(state.pending.type==='chooseCard'){
    actionHTML = `<div class="prompt">Choose a letter to play</div><div>Click one of your two cards above.</div>`;
  } else if(state.pending.type==='informantGuess'){
    let btns='';
    for(let r=2;r<=10;r++){ btns += `<button class="rank-btn" onclick="resolveInformantGuess('human',${r})">${r}</button>`; }
    actionHTML = `<div class="prompt">Whispered Accusation — name a rank</div><div class="rank-grid">${btns}</div>`;
  } else if(state.pending.type==='blindPick'){
    actionHTML = `<div class="prompt">Quarantine — blindly force a discard</div>
      <div class="hand">
        <div class="card back clickable" onclick="resolveBlindPick('human','${state.pending.target}',0)"><span>?</span></div>
        <div class="card back clickable" onclick="resolveBlindPick('human','${state.pending.target}',1)"><span>?</span></div>
      </div>`;
  } else if(state.pending.type==='regentChoice'){
    const targetP = state.players[state.pending.target];
    const cards = targetP.hand.map((c,i)=>{
      const def=defFor(c.rank);
      return `<div class="card clickable" style="--accent:${def.accent}" onclick="resolveRegentDiscard('${state.pending.target}',${i})">
        <div class="card-rank">${c.rank}</div><div class="card-name">${def.name}</div><div class="card-tag">${def.tag}</div></div>`;
    }).join('');
    actionHTML = `<div class="prompt">Trial by Court — choose which card ${targetP.name} discards</div><div class="hand">${cards}</div>`;
  } else if(state.pending.type==='archivistKeep'){
    const cards = state.pending.drawn.map(c=>{
      const def=defFor(c.rank);
      return `<div class="card clickable" style="--accent:${def.accent}" onclick="confirmArchivistKeep('${c.uid}')">
        <div class="card-rank">${c.rank}</div><div class="card-name">${def.name}</div><div class="card-tag">${def.tag}</div></div>`;
    }).join('');
    actionHTML = `<div class="prompt">Sealed Record — choose 1 letter to keep</div><div class="hand">${cards}</div>`;
  } else {
    actionHTML = `<div class="prompt">...</div>`;
  }

  const logHTML = state.log.map(l=>`<div class="entry">${l}</div>`).join('');

  let refHTML = '';
  if(state.showRef){
    refHTML = `<div class="ref-list">` + Object.keys(CARD_DEFS).sort((x,y)=>y-x).map(r=>{
      const d=CARD_DEFS[r];
      return `<div class="ref-item" style="--accent:${d.accent}"><div class="r">${r}</div><div class="t"><b>${d.name}</b> — ${d.tag}<span>${d.desc}</span></div></div>`;
    }).join('') + `<div class="ref-item" style="--accent:${SANCTUARY_DEF.accent}"><div class="r">·</div><div class="t"><b>Sanctuary</b> — hidden aside card<span>${SANCTUARY_DEF.desc}</span></div></div></div>`;
  }

  app.innerHTML = `
    <div class="header">
      <h1>The Empty Throne</h1>
      <div class="sub">mechanics prototype · placeholder art · 2 players</div>
    </div>
    <div class="layout">
      <div class="board">
        <div class="zone">
          <div class="zone-title"><span class="name">${a.name}</span><span class="status">${a.hand.length} card(s)${a.protected?'<span class=\\"shield-badge\\">Guarded</span>':''}</span></div>
          <div class="hand">${aiHandHTML}</div>
        </div>
        <div class="center-row">
          <div class="pile"><div class="big">${state.deck.length}</div><div class="label">Letters in case</div></div>
          <div class="pile"><div class="big">${state.discard.length}</div><div class="label">Discarded</div><div class="discard-strip">${discardHTML}</div></div>
        </div>
        <div class="zone">
          <div class="zone-title"><span class="name">${h.name}</span><span class="status">${h.hand.length} card(s)${h.protected?'<span class=\\"shield-badge\\">Guarded</span>':''}</span></div>
          <div class="hand">${humanHandHTML}</div>
        </div>
        <div class="action-panel">${actionHTML}</div>
      </div>
      <div class="sidebar">
        <div class="log-box"><div class="log-title">Court Record</div>${logHTML}</div>
        <div class="zone">
          <button class="btn ref-toggle" onclick="toggleRef()">${state.showRef?'Hide':'Show'} rank reference</button>
          ${refHTML}
        </div>
      </div>
    </div>
    <div class="note">Draw → Choose a card → Play it → Resolve its ability → Next player. Original game, original terms — built for design testing, not final art.</div>
  `;
}

initGame();
</script>
</body>
</html>
