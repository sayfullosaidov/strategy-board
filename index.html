<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Empty Throne</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Spectral:wght@400;500;600&family=Spectral+SC:wght@600&display=swap');

:root{
  --bg:#100d17;
  --bg-2:#181329;
  --panel:#1E1A2C;
  --panel-2:#241F38;
  --ink:#EDE6D6;
  --ink-dim:#B3A992;
  --gold:#D3AD3A;
  --gold-bright:#EAC85A;
  --gold-dim:#7d6a26;
  --line:#39355a;
  --parchment:#EAE0C4;
  --parchment-2:#DED0A6;
  --parchment-ink:#2B2410;
  --crimson:#8C2430;
  --shadow: 0 8px 22px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, #241d3c 0%, transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 100%, #201936 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'Spectral',serif;
  min-height:100vh;
  position:relative;
}
body::before{ /* fine grain texture overlay */
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
h1,h2,h3,.display{ font-family:'Cinzel',serif; letter-spacing:.03em; }
#app{ max-width:1180px; margin:0 auto; padding:22px 16px 60px; position:relative; z-index:1; }

/* ---------- Header ---------- */
.header{ text-align:center; margin-bottom:14px; }
.header h1{ font-size:2.3rem; color:var(--gold-bright); margin:0 0 2px; text-transform:uppercase; letter-spacing:.16em; text-shadow:0 2px 12px rgba(211,173,58,.25); }
.header .sub{ color:var(--ink-dim); font-size:.82rem; letter-spacing:.06em; font-family:'Spectral SC',serif; }
.flourish{ display:flex; align-items:center; justify-content:center; gap:10px; color:var(--gold-dim); margin:8px auto 18px; max-width:420px; }
.flourish .line{ flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold-dim),transparent); }
.flourish .gem{ font-size:.9rem; color:var(--gold); }

/* ---------- Turn banner ---------- */
.turn-banner{ display:flex; justify-content:space-between; align-items:center; gap:14px; background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:8px; padding:11px 18px; margin-bottom:14px; box-shadow:var(--shadow); position:relative; }
.turn-banner::before,.turn-banner::after{ content:'❖'; color:var(--gold-dim); font-size:.75rem; position:absolute; top:50%; transform:translateY(-50%); }
.turn-banner::before{ left:8px; } .turn-banner::after{ right:8px; }
.turn-banner.human{ border-color:var(--gold); box-shadow:0 0 0 1px rgba(211,173,58,.3) inset, var(--shadow); }
.turn-banner.ai{ border-color:#5a5478; }
.tb-who{ font-family:'Cinzel',serif; font-size:1rem; letter-spacing:.06em; white-space:nowrap; }
.turn-banner.human .tb-who{ color:var(--gold-bright); }
.turn-banner.ai .tb-who{ color:#b3aee0; }
.tb-last{ font-size:.82rem; color:var(--ink-dim); text-align:right; }

/* ---------- Spotlight (main-screen action display) ---------- */
@keyframes spotIn{ from{ opacity:0; transform:translateY(-6px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
.spotlight{
  background:radial-gradient(ellipse at top, #2a2246 0%, var(--panel) 70%);
  border:1px solid var(--gold-dim); border-radius:10px; padding:16px 18px;
  margin-bottom:14px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:16px;
  animation:spotIn .4s ease;
}
.spotlight .spot-card{ flex-shrink:0; }
.spotlight .spot-body{ flex:1; min-width:0; }
.spotlight .spot-actor{ font-family:'Cinzel',serif; font-size:.78rem; letter-spacing:.08em; color:var(--gold); text-transform:uppercase; }
.spotlight .spot-text{ font-size:1.05rem; line-height:1.4; margin-top:4px; color:var(--ink); }
.spotlight .spot-stages{ display:flex; gap:6px; margin-top:10px; }
.spot-stage{ font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); padding:3px 9px; border:1px solid var(--line); border-radius:999px; }
.spot-stage.active{ color:#1a1408; background:var(--gold); border-color:var(--gold); font-weight:600; }
.spot-stage.done{ color:var(--gold-dim); border-color:var(--gold-dim); }

/* ---------- Layout ---------- */
.layout{ display:grid; grid-template-columns: 1fr 320px; gap:18px; align-items:start; }
@media (max-width:860px){ .layout{ grid-template-columns:1fr; } }
.board{ display:flex; flex-direction:column; gap:14px; }
.zone{ background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:1px solid var(--line); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow); }
.zone-title{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.zone-title .name{ font-family:'Cinzel',serif; font-size:.95rem; color:var(--gold); letter-spacing:.05em; }
.zone-title .status{ font-size:.75rem; color:var(--ink-dim); }
.shield-badge{ display:inline-block; background:#26355a; color:#a9c6ff; border:1px solid #3c5a8f; border-radius:999px; padding:2px 9px; font-size:.68rem; margin-left:8px; }

/* ---------- Cards ---------- */
.hand{ display:flex; gap:12px; flex-wrap:wrap; }
.card{
  width:104px; min-height:150px; border-radius:9px; padding:9px;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.25), transparent 45%),
    linear-gradient(160deg,var(--parchment),var(--parchment-2));
  color:var(--parchment-ink); border:2px solid var(--accent,#8a7527);
  display:flex; flex-direction:column; position:relative;
  box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.35), inset 0 0 0 4px rgba(0,0,0,.08);
}
.card::before,.card::after{ content:'❖'; position:absolute; font-size:.55rem; color:var(--accent,#8a7527); opacity:.7; }
.card::before{ top:4px; left:5px; } .card::after{ bottom:4px; right:5px; }
.card .card-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.card .card-rank{ font-family:'Cinzel',serif; font-size:1.25rem; font-weight:800; color:var(--accent,#8a7527); line-height:1; }
.card .card-icon{ font-size:1.05rem; opacity:.9; }
.card .card-name{ font-family:'Cinzel',serif; font-size:.72rem; font-weight:700; line-height:1.2; margin-top:8px; text-align:center; }
.card .card-divider{ height:1px; background:linear-gradient(90deg,transparent,var(--accent,#8a7527),transparent); margin:6px 0; opacity:.6; }
.card .card-tag{ font-size:.62rem; font-style:italic; opacity:.8; line-height:1.25; text-align:center; margin-top:auto; }
.card.small{ width:78px; min-height:110px; padding:6px; }
.card.small .card-rank{ font-size:1rem; }
.card.small .card-name{ font-size:.6rem; margin-top:5px; }
.card.small .card-tag{ font-size:.53rem; }
.card.large{ width:130px; min-height:184px; padding:12px; }
.card.large .card-rank{ font-size:1.6rem; }
.card.large .card-name{ font-size:.85rem; }
.card.large .card-tag{ font-size:.7rem; }
.card.back{
  align-items:center; justify-content:center;
  background:
    repeating-linear-gradient(45deg, #241d3c 0 8px, #1c1730 8px 16px);
  border-color:#4a4270;
  box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.06);
}
.card.back span{ font-family:'Cinzel',serif; color:var(--gold-dim); font-size:1.7rem; }
.card.clickable{ cursor:pointer; transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease; }
.card.clickable:hover{ transform:translateY(-6px); box-shadow:0 10px 22px rgba(0,0,0,.5), 0 0 0 2px var(--gold-bright); }
.card.disabled{ opacity:.42; filter:grayscale(.5); cursor:not-allowed; }
.card.disabled:hover{ transform:none; box-shadow:0 4px 12px rgba(0,0,0,.4); }

/* ---------- Center piles ---------- */
.center-row{ display:flex; gap:14px; }
.pile{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; flex:1; text-align:center; }
.pile .big{ font-family:'Cinzel',serif; font-size:1.7rem; color:var(--gold); }
.pile .label{ font-size:.7rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }

/* ---------- Discard piles ---------- */
.discard-section{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); }
.discard-box{ background:#161226; border:1px solid #3a3552; border-radius:8px; padding:8px 10px; min-height:56px; }
.discard-box .discard-header{ font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); margin-bottom:6px; font-family:'Spectral SC',serif; }
.discard-box .discard-empty{ font-size:.72rem; color:#6a648a; font-style:italic; }
.discard-box .strip{ display:flex; gap:5px; flex-wrap:wrap; }
.discard-box .mini{ width:30px; height:40px; border-radius:4px; background:var(--parchment); border:1px solid var(--accent,#8a7527); color:var(--parchment-ink); font-family:'Cinzel',serif; font-weight:700; font-size:.82rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 2px 5px rgba(0,0,0,.35); }

/* ---------- Action panel (proclamation) ---------- */
.action-panel{ background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:1px solid var(--gold-dim); border-radius:10px; padding:18px; min-height:70px; box-shadow:var(--shadow); }
.action-panel .prompt{ font-family:'Cinzel',serif; color:var(--gold); font-size:.92rem; margin-bottom:10px; letter-spacing:.03em; }
.btn{
  background:linear-gradient(160deg,#3a3355,#241f38); color:var(--ink); border:1px solid var(--gold-dim);
  border-radius:6px; padding:9px 16px; font-family:'Spectral',serif; font-size:.9rem; cursor:pointer; margin:3px 6px 3px 0;
  transition:filter .12s ease;
}
.btn:hover{ border-color:var(--gold); color:#fff; filter:brightness(1.1); }
.btn.primary{ background:linear-gradient(160deg,var(--gold-bright),#93791e); color:#201a08; font-weight:700; border:none; }
.btn.primary:hover{ filter:brightness(1.08); }
.rank-grid{ display:flex; flex-wrap:wrap; gap:6px; }
.rank-btn{ width:46px; height:46px; border-radius:6px; border:1px solid var(--gold-dim); background:var(--panel-2); color:var(--ink); font-family:'Cinzel',serif; font-size:1rem; cursor:pointer; transition:filter .12s ease; }
.rank-btn:hover{ border-color:var(--gold); color:var(--gold); filter:brightness(1.15); }

/* ---------- Sidebar / log ---------- */
.sidebar{ display:flex; flex-direction:column; gap:14px; }
.log-box{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow); }
.log-title{ font-family:'Cinzel',serif; color:var(--gold); font-size:.85rem; margin-bottom:8px; letter-spacing:.05em; }
.recent-list{ display:flex; flex-direction:column; gap:0; }
.recent-item{ padding:8px 2px; border-bottom:1px dashed var(--line); font-size:.85rem; line-height:1.4; color:var(--ink); }
.recent-item:nth-child(1){ font-size:.92rem; color:#fff; }
.recent-item:nth-child(2){ opacity:.85; } .recent-item:nth-child(3){ opacity:.68; }
.recent-item:nth-child(4){ opacity:.52; } .recent-item:nth-child(5){ opacity:.4; }
.recent-item:last-child{ border-bottom:none; }
.full-log{ max-height:240px; overflow-y:auto; margin-top:8px; border-top:1px solid var(--line); padding-top:8px; }
.full-log .entry{ padding:4px 0; font-size:.76rem; color:var(--ink-dim); border-bottom:1px dashed var(--line); }

/* ---------- Codex (rank reference + rule book) ---------- */
.codex-tabs{ display:flex; gap:6px; margin-bottom:10px; }
.codex-tab{ flex:1; text-align:center; font-family:'Cinzel',serif; font-size:.72rem; letter-spacing:.04em; padding:8px 6px; border-radius:6px; border:1px solid var(--gold-dim); background:var(--panel-2); color:var(--ink-dim); cursor:pointer; }
.codex-tab.active{ background:var(--gold); color:#1a1408; font-weight:700; border-color:var(--gold); }
.ref-list{ display:flex; flex-direction:column; gap:8px; }
.ref-item{ display:flex; gap:10px; align-items:flex-start; border-left:3px solid var(--accent); padding-left:8px; }
.ref-item .r{ font-family:'Cinzel',serif; font-weight:700; color:var(--accent); width:26px; text-align:center; }
.ref-item .t{ font-size:.78rem; line-height:1.35; }
.ref-item .t b{ color:var(--ink); }
.ref-item .t span{ color:var(--ink-dim); display:block; font-size:.72rem; margin-top:1px;}

.rulebook{ font-size:.8rem; line-height:1.55; color:var(--ink-dim); }
.rulebook h4{ font-family:'Cinzel',serif; color:var(--gold); font-size:.8rem; letter-spacing:.05em; margin:14px 0 6px; text-transform:uppercase; }
.rulebook h4:first-child{ margin-top:0; }
.rulebook p{ margin:0 0 8px; }
.rulebook ul{ margin:0 0 8px; padding-left:18px; }
.rulebook li{ margin-bottom:4px; }
.rulebook b{ color:var(--ink); }

/* ---------- Game over ---------- */
.gameover{ text-align:center; padding:16px; }
.gameover h2{ color:var(--gold-bright); font-size:1.35rem; margin-bottom:10px; }

.note{ font-size:.72rem; color:var(--ink-dim); text-align:center; margin-top:20px; line-height:1.5; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================================
   CARD DEFINITIONS — unchanged game data (ranks, copies, abilities, text)
   ========================================================================= */
const CARD_DEFS = {
  1:{ name:'The Herald', copies:2, tag:'Uprising', accent:'#8B8FA3', icon:'📯',
      desc:'The 1st copy played does nothing. When the 2nd copy is played by anyone, that player immediately enacts the Regent\u2019s Trial.' },
  2:{ name:'The Informant', copies:2, tag:'Whispered Accusation', accent:'#4C8A5E', icon:'🗣️',
      desc:'Name a rank (2\u201310) for the opponent\u2019s hand card. Correct guess eliminates them.' },
  3:{ name:'The Oracle', copies:2, tag:'Foresight', accent:'#8A63C9', icon:'🔮',
      desc:'Privately view the opponent\u2019s hand card.' },
  4:{ name:'The Warden', copies:2, tag:'Standing Guard', accent:'#4E86C9', icon:'🛡️',
      desc:'You are immune to all targeted effects until your next turn.' },
  5:{ name:'The Plague Doctor', copies:2, tag:'Quarantine', accent:'#6E8A4A', icon:'☠️',
      desc:'Opponent draws a card, then you blindly choose one of their two cards to force discarded.' },
  6:{ name:'The Blade Marshal', copies:2, tag:'Formal Duel', accent:'#B23A44', icon:'⚔️',
      desc:'Secretly compare hand cards with the opponent. Lower rank is eliminated.' },
  7:{ name:'The Archivist', copies:2, tag:'Sealed Record', accent:'#C08A2E', icon:'📜',
      desc:'On your next turn, draw 3, keep 1, and return the other 2 to the top of the case.' },
  8:{ name:'The Enchantress', copies:2, tag:'Binding Exchange', accent:'#B14F97', icon:'✨',
      desc:'Swap your hand card with the opponent\u2019s.' },
  9:{ name:'The Regent', copies:1, tag:'Trial by Court', accent:'#D9B23A', icon:'👑',
      desc:'Opponent draws a card and reveals both to you. You choose which they discard. The only effect that permanently removes the Exiled Heir.' },
  10:{ name:'The Exiled Heir', copies:1, tag:'Bloodline in Hiding', accent:'#EDE3CE', icon:'🕊️',
      desc:'Cannot be played normally. If forced to discard by anything except the Regent\u2019s Trial, you draw the Sanctuary card instead and remain in the game.' },
};
const SANCTUARY_DEF = { name:'Sanctuary', tag:'Safehouse Identity', accent:'#9C9686', icon:'🏚️', desc:'No special ability. A quiet place to hide.' };
function defFor(rank){ return rank===0 ? SANCTUARY_DEF : CARD_DEFS[rank]; }
function powerScore(rank){ return ({1:1,2:3,3:2,4:2,5:3,6:4,7:4,8:5,9:8,10:9})[rank] || 0; }

/* =========================================================================
   PACING — single source of truth for every readability delay.
   Raise/lower these to retune speed; nothing else needs to change.
   ========================================================================= */
const PACE = {
  drawHold:      1600,  // let "X draws a letter" register before the next step
  aiThink:       2000,  // AI "thinking" beat before it commits to a choice
  playToAbility: 2400,  // pause between "X plays Y" and the ability beginning
  subStep:       2400,  // pause between an ability's setup/reveal and its outcome
  resultHold:    2400,  // pause holding the final result on screen
  turnGap:       2000,  // pause before the next player's turn begins
  gameOverReveal:2400   // pause before the final "Play Again" panel appears
};
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

/* =========================================================================
   STATE
   ========================================================================= */
let state = null;
let pendingResolver = null; // resolves the Promise a human choice is awaited on

function uid(){ return Math.random().toString(36).slice(2,9); }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function buildDeck(){
  let d=[];
  for(const rank in CARD_DEFS){ const def=CARD_DEFS[rank]; for(let i=0;i<def.copies;i++) d.push({uid:uid(),rank:Number(rank)}); }
  return d;
}
function opponentOf(p){ return p==='human'?'ai':'human'; }
function log(msg){ state.log.unshift(msg); if(state.log.length>80) state.log.pop(); }

function setSpotlight(patch){
  state.spotlight = Object.assign({}, state.spotlight, patch);
}

function initGame(){
  state = {
    deck: shuffle(buildDeck()),
    discardPiles: { human: [], ai: [] },
    sanctuary: null,
    players: {
      human: { name:'You', hand:[], protected:false, eliminated:false, pendingArchivist:false },
      ai: { name:'The Rival Claimant', hand:[], protected:false, eliminated:false, pendingArchivist:false }
    },
    turn:'human',
    heraldCount:0,
    log:[],
    pending:{type:'none'},
    gameOver:false,
    showGameOverPanel:false,
    aiKnowledge:{ humanRank:null },
    showRef:false,
    showFullLog:false,
    codexTab:'ref',
    spotlight:{ actorKey:null, actorName:'', cardRank:null, def:null, stage:'idle', stageText:'The court awaits the first move.' }
  };
  state.players.human.hand.push(state.deck.pop());
  state.players.ai.hand.push(state.deck.pop());
  state.sanctuary = state.deck.pop();
  log('The dispatch case is sealed. The game begins \u2014 ' + state.deck.length + ' letters remain.');
  pendingResolver = null;
  render();
  gameLoop();
}

/* =========================================================================
   HUMAN-CHOICE BRIDGE
   waitForHuman() sets the pending UI state and returns a Promise that a
   click handler later resolves via resumeHuman(). This lets the whole turn
   flow read as one linear async function instead of scattered callbacks.
   ========================================================================= */
function waitForHuman(pendingState){
  state.pending = pendingState;
  render();
  return new Promise(resolve => { pendingResolver = resolve; });
}
function resumeHuman(value){
  if(!pendingResolver) return; // guards against double-clicks / stale buttons
  const r = pendingResolver;
  pendingResolver = null;
  state.pending = {type:'none'};
  r(value);
}

/* Click handlers (thin wrappers around resumeHuman) */
function chooseCard(idx){
  if(state.pending.type!=='chooseCard') return;
  const hand = state.players.human.hand;
  if(hand[idx].rank===10 && hand.length>1) return; // Heir can't be played normally
  resumeHuman(idx);
}
function pickInformantRank(r){ if(state.pending.type!=='informantGuess') return; resumeHuman(r); }
function pickBlind(slot){ if(state.pending.type!=='blindPick') return; resumeHuman(slot); }
function pickRegentDiscard(idx){ if(state.pending.type!=='regentChoice') return; resumeHuman(idx); }
function pickArchivistKeep(theUid){ if(state.pending.type!=='archivistKeep') return; resumeHuman(theUid); }

/* =========================================================================
   MAIN GAME LOOP — Draw -> Choose -> Play -> Resolve -> Next player
   ========================================================================= */
async function gameLoop(){
  while(!state.gameOver){
    const p = state.turn;
    const player = state.players[p];
    player.protected = false;
    render();

    if(state.deck.length===0){ await endByComparison(); break; }

    if(player.pendingArchivist){
      player.pendingArchivist = false;
      await runArchivistDraw(p);
    } else {
      const card = state.deck.pop();
      player.hand.push(card);
      setSpotlight({ actorKey:p, actorName:player.name, cardRank:null, def:null, stage:'draw',
        stageText:`${player.name} draws a letter from the case.` });
      log(`${player.name} draws a letter. (${state.deck.length} left in the case)`);
      render();
      await sleep(PACE.drawHold);
    }
    if(state.gameOver) break;

    let idx;
    if(p==='human'){
      idx = await waitForHuman({type:'chooseCard'});
    } else {
      await sleep(PACE.aiThink);
      idx = aiPickIndex();
    }
    if(state.gameOver) break;

    await playCardFlow(p, idx);
    if(state.gameOver) break;

    state.turn = opponentOf(p);
    render();
    await sleep(PACE.turnGap);
  }
}

async function runArchivistDraw(p){
  const player = state.players[p];
  const n = Math.min(3, state.deck.length);
  if(n===0){
    log(`${player.name}'s Sealed Record finds the case empty.`);
    await endByComparison();
    return;
  }
  let drawn=[]; for(let i=0;i<n;i++) drawn.push(state.deck.pop());
  setSpotlight({ actorKey:p, actorName:player.name, cardRank:7, def:CARD_DEFS[7], stage:'resolving',
    stageText:`${player.name} draws ${n} letters for the Sealed Record...` });
  log(`${player.name} invokes the Sealed Record, drawing ${n} letter(s).`);
  render();
  await sleep(PACE.subStep);

  let keepUid;
  if(p==='human'){
    keepUid = await waitForHuman({type:'archivistKeep', drawn});
  } else {
    await sleep(PACE.aiThink);
    const sorted = drawn.slice().sort((a,b)=>powerScore(b.rank)-powerScore(a.rank));
    keepUid = sorted[0].uid;
  }
  const keepIdx = drawn.findIndex(c=>c.uid===keepUid);
  const keep = drawn[keepIdx];
  const rest = drawn.filter((c,i)=>i!==keepIdx);
  player.hand.push(keep);
  for(const c of rest) state.deck.push(c);
  log(`${player.name} keeps ${defFor(keep.rank).name} (${keep.rank}) and returns the rest to the top of the case.`);
  setSpotlight({ stage:'result', stageText:`${player.name} keeps ${defFor(keep.rank).name} and returns the rest to the case.` });
  render();
  await sleep(PACE.resultHold);
}

function aiPickIndex(){
  const hand = state.players.ai.hand;
  let idxs = hand.map((c,i)=>i).filter(i=>hand[i].rank!==10);
  if(idxs.length===0) idxs = hand.map((c,i)=>i);
  idxs.sort((a,b)=>powerScore(hand[a].rank)-powerScore(hand[b].rank));
  return idxs[0];
}

async function playCardFlow(p, idx){
  const player = state.players[p];
  const card = player.hand.splice(idx,1)[0];
  state.discardPiles[p].push(card);
  const def = defFor(card.rank);
  setSpotlight({ actorKey:p, actorName:player.name, cardRank:card.rank, def, stage:'played',
    stageText:`${player.name} plays ${def.name} \u2014 "${def.tag}"` });
  log(`${player.name} plays ${def.name} (${card.rank}) \u2014 "${def.tag}"`);
  render();
  await sleep(PACE.playToAbility);
  if(state.gameOver) return;
  await resolveAbility(p, card);
  if(state.gameOver) return;
  await sleep(PACE.resultHold);
}

function blocked(targetP, phrase){
  log(`${targetP.name} is shielded by the Warden \u2014 ${phrase}.`);
  setSpotlight({ stage:'result', stageText:`${targetP.name} is shielded by the Warden \u2014 ${phrase}.` });
  render();
}

/* =========================================================================
   ABILITIES — same rules and outcomes as before, now written as one
   linear async sequence per card so the pacing is explicit and easy to tune.
   ========================================================================= */
async function resolveAbility(p, card){
  const player = state.players[p], opp = opponentOf(p), oppPlayer = state.players[opp];
  switch(card.rank){
    case 1: {
      state.heraldCount++;
      if(state.heraldCount>=2){
        setSpotlight({ stage:'resolving', stageText:'The second Herald ignites an Uprising!' });
        log(`The second Herald ignites an Uprising! ${player.name} enacts the Regent's Trial.`);
        render();
        await sleep(PACE.subStep);
        await runRegentTrial(p, opp);
      } else {
        log('The people watch and wait. Nothing happens... yet.');
        setSpotlight({ stage:'result', stageText:'The people watch and wait. Nothing happens... yet.' });
        render();
      }
      break;
    }
    case 2: {
      if(oppPlayer.protected){ blocked(oppPlayer, 'the accusation cannot be made'); break; }
      setSpotlight({ stage:'resolving', stageText:`${player.name} prepares a Whispered Accusation...` });
      render();
      let guess;
      if(p==='human'){ guess = await waitForHuman({type:'informantGuess'}); }
      else { await sleep(PACE.aiThink); guess = aiGuessRank(); }
      log(`${player.name} accuses: "You hold ${defFor(guess).name}!"`);
      setSpotlight({ stage:'resolving', stageText:`${player.name} accuses: "You hold ${defFor(guess).name}!"` });
      render();
      await sleep(PACE.subStep);
      if(guess === oppPlayer.hand[0].rank){
        eliminate(opp, `The accusation is true \u2014 ${oppPlayer.name} is exposed and eliminated!`);
        setSpotlight({ stage:'result', stageText:`Correct! ${oppPlayer.name} is exposed and eliminated.` });
      } else {
        log(`Wrong \u2014 ${oppPlayer.name} breathes easy.`);
        setSpotlight({ stage:'result', stageText:`Wrong guess \u2014 ${oppPlayer.name} breathes easy.` });
      }
      render();
      break;
    }
    case 3: {
      if(oppPlayer.protected){ blocked(oppPlayer, 'Foresight fails'); break; }
      const seen = oppPlayer.hand[0];
      if(p==='human'){
        log(`Foresight reveals: ${oppPlayer.name} holds ${defFor(seen.rank).name} (${seen.rank}).`);
        setSpotlight({ stage:'result', stageText:`Foresight reveals: ${oppPlayer.name} holds ${defFor(seen.rank).name}.` });
      } else {
        state.aiKnowledge.humanRank = seen.rank;
        log(`${player.name} peers into your letter... and says nothing.`);
        setSpotlight({ stage:'result', stageText:`${player.name} peers into your letter... and says nothing.` });
      }
      render();
      break;
    }
    case 4: {
      player.protected = true;
      log(`${player.name} stands under the Warden's guard.`);
      setSpotlight({ stage:'result', stageText:`${player.name} stands under the Warden's guard \u2014 protected until their next turn.` });
      render();
      break;
    }
    case 5: {
      if(oppPlayer.protected){ blocked(oppPlayer, 'the Quarantine fails'); break; }
      if(state.deck.length===0){
        log('The case is empty \u2014 the Quarantine has no effect.');
        setSpotlight({ stage:'result', stageText:'The case is empty \u2014 the Quarantine has no effect.' });
        render();
        break;
      }
      const drawn = state.deck.pop(); oppPlayer.hand.push(drawn);
      log(`${oppPlayer.name} is forced to draw for the Quarantine.`);
      setSpotlight({ stage:'resolving', stageText:`${oppPlayer.name} is forced to draw. ${player.name} will blindly choose which card is discarded...` });
      render();
      await sleep(PACE.subStep);
      let pickIdx;
      if(p==='human'){ pickIdx = await waitForHuman({type:'blindPick', target:opp}); }
      else { await sleep(PACE.aiThink); pickIdx = Math.floor(Math.random()*2); }
      await resolveBlindPick(opp, pickIdx);
      break;
    }
    case 6: {
      if(oppPlayer.protected){ blocked(oppPlayer, 'the Duel is refused'); break; }
      const mine = player.hand[0], theirs = oppPlayer.hand[0];
      log(`${player.name} calls a Formal Duel!`);
      setSpotlight({ stage:'resolving', stageText:`${player.name} calls a Formal Duel! Comparing hands in secret...` });
      render();
      await sleep(PACE.subStep);
      if(mine.rank===theirs.rank){
        log('Both reveal the same rank \u2014 a stalemate. No one falls.');
        setSpotlight({ stage:'result', stageText:'A stalemate \u2014 both hold the same rank. No one falls.' });
      } else if(mine.rank>theirs.rank){
        eliminate(opp, `${oppPlayer.name}'s ${defFor(theirs.rank).name} falls to ${player.name}'s ${defFor(mine.rank).name}.`);
        setSpotlight({ stage:'result', stageText:`${oppPlayer.name} falls in the Duel.` });
      } else {
        eliminate(p, `${player.name}'s ${defFor(mine.rank).name} falls to ${oppPlayer.name}'s ${defFor(theirs.rank).name}.`);
        setSpotlight({ stage:'result', stageText:`${player.name} falls in the Duel.` });
      }
      render();
      break;
    }
    case 7: {
      player.pendingArchivist = true;
      log(`${player.name} seals a Record \u2014 extra letters await on their next turn.`);
      setSpotlight({ stage:'result', stageText:`${player.name} seals a Record \u2014 extra letters await on their next turn.` });
      render();
      break;
    }
    case 8: {
      if(oppPlayer.protected){ blocked(oppPlayer, 'the Exchange fails'); break; }
      const mine = player.hand[0], theirs = oppPlayer.hand[0];
      player.hand[0] = theirs; oppPlayer.hand[0] = mine;
      log(`${player.name} performs a Binding Exchange with ${oppPlayer.name}.`);
      setSpotlight({ stage:'result', stageText:`${player.name} performs a Binding Exchange with ${oppPlayer.name}.` });
      if(p==='ai') state.aiKnowledge.humanRank = null;
      render();
      break;
    }
    case 9: {
      await runRegentTrial(p, opp);
      break;
    }
    default: break;
  }
}

async function runRegentTrial(actor, target){
  const targetP = state.players[target];
  if(targetP.protected){ blocked(targetP, 'the Trial cannot proceed'); return; }
  if(state.deck.length===0){
    log('The case is empty \u2014 the Trial cannot proceed.');
    setSpotlight({ stage:'result', stageText:'The case is empty \u2014 the Trial cannot proceed.' });
    render();
    return;
  }
  const drawn = state.deck.pop();
  targetP.hand.push(drawn);
  log(`${targetP.name} draws for the Trial and must reveal both letters.`);
  setSpotlight({ stage:'resolving', stageText:`${targetP.name} draws and reveals both letters for the Trial...` });
  render();
  await sleep(PACE.subStep);

  let idx;
  if(actor==='human'){
    idx = await waitForHuman({type:'regentChoice', target});
  } else {
    await sleep(PACE.aiThink);
    const opts = targetP.hand;
    const heirIdx = opts.findIndex(c=>c.rank===10);
    idx = heirIdx>=0 ? heirIdx : (powerScore(opts[0].rank) >= powerScore(opts[1].rank) ? 0 : 1);
  }
  const card = targetP.hand.splice(idx,1)[0];
  state.discardPiles[target].push(card);
  if(card.rank===10){
    log('The Exiled Heir is exposed and cast out by the Trial \u2014 no reincarnation can save it now.');
    setSpotlight({ stage:'result', stageText:'The Exiled Heir is exposed and cast out \u2014 no reincarnation this time.' });
  } else {
    log(`${targetP.name} is forced to discard ${defFor(card.rank).name} (${card.rank}).`);
    setSpotlight({ stage:'result', stageText:`${targetP.name} is forced to discard ${defFor(card.rank).name}.` });
  }
  render();
}

async function resolveBlindPick(target, idx){
  const targetP = state.players[target];
  const card = targetP.hand[idx];
  if(card.rank===10){
    targetP.hand.splice(idx,1);
    targetP.hand.push(state.sanctuary);
    state.sanctuary = card;
    log(`${targetP.name} reveals... the Exiled Heir! Reincarnation triggers \u2014 they draw the Sanctuary card and remain in the game.`);
    setSpotlight({ stage:'result', stageText:`The Exiled Heir is revealed! Reincarnation saves ${targetP.name}.` });
  } else {
    targetP.hand.splice(idx,1);
    state.discardPiles[target].push(card);
    log(`${targetP.name} was forced to discard ${defFor(card.rank).name} (${card.rank}), chosen blindly.`);
    setSpotlight({ stage:'result', stageText:`${targetP.name} is forced to discard ${defFor(card.rank).name}, chosen blindly.` });
  }
  render();
}

function aiGuessRank(){
  if(state.aiKnowledge.humanRank && state.aiKnowledge.humanRank>=2) return state.aiKnowledge.humanRank;
  const counts={};
  for(let r=2;r<=10;r++) counts[r]=CARD_DEFS[r].copies;
  const allDiscards = state.discardPiles.human.concat(state.discardPiles.ai);
  for(const c of allDiscards) if(counts[c.rank]!==undefined) counts[c.rank]--;
  for(const c of state.players.ai.hand) if(counts[c.rank]!==undefined) counts[c.rank]--;
  let pool=[];
  for(let r=2;r<=10;r++) for(let i=0;i<Math.max(counts[r],0);i++) pool.push(r);
  if(pool.length===0) return 2;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* =========================================================================
   END OF GAME
   ========================================================================= */
function eliminate(p, msg){ state.players[p].eliminated = true; log(msg); checkGameEnd(); }

function checkGameEnd(){
  const h=state.players.human, a=state.players.ai;
  if(h.eliminated && !a.eliminated) endGame(`${a.name} wins \u2014 you were eliminated.`);
  else if(a.eliminated && !h.eliminated) endGame(`You win! ${a.name} has been eliminated.`);
  else if(h.eliminated && a.eliminated) endGame(`Both claimants fall \u2014 the throne remains empty. It's a draw.`);
}

async function endByComparison(){
  const h=state.players.human, a=state.players.ai;
  log('The dispatch case is empty. Remaining claimants reveal their final letters.');
  setSpotlight({ actorKey:null, cardRank:null, def:null, stage:'resolving', stageText:'The dispatch case is empty. Final letters are revealed...' });
  render();
  await sleep(PACE.subStep);
  const hc=h.hand[0], ac=a.hand[0];
  log(`You hold ${defFor(hc.rank).name} (${hc.rank}). ${a.name} holds ${defFor(ac.rank).name} (${ac.rank}).`);
  setSpotlight({ stage:'result', stageText:`You hold ${defFor(hc.rank).name} (${hc.rank}). ${a.name} holds ${defFor(ac.rank).name} (${ac.rank}).` });
  render();
  await sleep(PACE.subStep);
  if(hc.rank>ac.rank) await endGame('Your higher standing wins you the throne!');
  else if(ac.rank>hc.rank) await endGame(`${a.name}'s higher standing claims the throne.`);
  else await endGame('A perfect tie in standing \u2014 the throne remains empty. It\u2019s a draw.');
}

async function endGame(msg){
  state.gameOver = true;
  state.showGameOverPanel = false;
  log(msg);
  setSpotlight({ stage:'result', stageText: msg });
  render();
  await sleep(PACE.gameOverReveal);
  state.showGameOverPanel = true;
  render();
}

/* =========================================================================
   UI toggles
   ========================================================================= */
function toggleLog(){ state.showFullLog = !state.showFullLog; render(); }
function setCodexTab(tab){ state.codexTab = tab; render(); }

/* =========================================================================
   RENDER
   ========================================================================= */
function cardHTML(card, opts){
  opts = opts || {};
  const def = defFor(card.rank);
  const sizeClass = opts.size ? ' ' + opts.size : '';
  const clickable = opts.onclick && !opts.disabled;
  return `<div class="card${sizeClass} ${clickable?'clickable':''} ${opts.disabled?'disabled':''}" style="--accent:${def.accent}" ${clickable?`onclick="${opts.onclick}"`:''}>
    <div class="card-top"><span class="card-rank">${card.rank}</span><span class="card-icon">${def.icon}</span></div>
    <div class="card-name">${def.name}</div>
    <div class="card-divider"></div>
    <div class="card-tag">${def.tag}${opts.disabled && opts.disabledNote ? ' \u2014 ' + opts.disabledNote : ''}</div>
  </div>`;
}
function cardBackHTML(size){
  const sizeClass = size ? ' ' + size : '';
  return `<div class="card back${sizeClass}"><span>?</span></div>`;
}

function render(){
  const app = document.getElementById('app');
  const h = state.players.human, a = state.players.ai;

  const aiHandHTML = a.hand.map(()=>cardBackHTML()).join('');
  const humanHandHTML = h.hand.map((c,i)=>{
    const isChooseStep = state.turn==='human' && state.pending.type==='chooseCard';
    const isHeirBlocked = c.rank===10 && h.hand.length>1;
    return cardHTML(c, {
      onclick: isChooseStep ? `chooseCard(${i})` : null,
      disabled: isChooseStep && isHeirBlocked,
      disabledNote: 'cannot be played'
    });
  }).join('');

  function discardBoxHTML(pile){
    if(pile.length===0) return `<div class="discard-empty">No cards discarded yet</div>`;
    return `<div class="strip">` + pile.slice().reverse().map(c=>{
      const def=defFor(c.rank);
      return `<div class="mini" style="--accent:${def.accent}" title="${def.name} (${c.rank})">${c.rank}</div>`;
    }).join('') + `</div>`;
  }

  /* ---- Action panel ---- */
  let actionHTML = '';
  if(state.gameOver){
    actionHTML = state.showGameOverPanel
      ? `<div class="gameover"><h2>${state.log[0]}</h2><button class="btn primary" onclick="initGame()">Play Again</button></div>`
      : `<div class="prompt">${state.log[0] || ''}</div>`;
  } else if(state.turn!=='human'){
    actionHTML = `<div class="prompt">${a.name} is deciding...</div>`;
  } else if(state.pending.type==='chooseCard'){
    actionHTML = `<div class="prompt">Choose a letter to play</div><div>Click one of your two cards above.</div>`;
  } else if(state.pending.type==='informantGuess'){
    let btns=''; for(let r=2;r<=10;r++){ btns += `<button class="rank-btn" onclick="pickInformantRank(${r})">${r}</button>`; }
    actionHTML = `<div class="prompt">Whispered Accusation \u2014 name a rank</div><div class="rank-grid">${btns}</div>`;
  } else if(state.pending.type==='blindPick'){
    actionHTML = `<div class="prompt">Quarantine \u2014 blindly force a discard</div>
      <div class="hand">
        <div class="card back clickable" onclick="pickBlind(0)"><span>?</span></div>
        <div class="card back clickable" onclick="pickBlind(1)"><span>?</span></div>
      </div>`;
  } else if(state.pending.type==='regentChoice'){
    const targetP = state.players[state.pending.target];
    const cards = targetP.hand.map((c,i)=>cardHTML(c, {onclick:`pickRegentDiscard(${i})`})).join('');
    actionHTML = `<div class="prompt">Trial by Court \u2014 choose which card ${targetP.name} discards</div><div class="hand">${cards}</div>`;
  } else if(state.pending.type==='archivistKeep'){
    const cards = state.pending.drawn.map(c=>cardHTML(c, {onclick:`pickArchivistKeep('${c.uid}')`})).join('');
    actionHTML = `<div class="prompt">Sealed Record \u2014 choose 1 letter to keep</div><div class="hand">${cards}</div>`;
  } else {
    actionHTML = `<div class="prompt">Awaiting the court's next move...</div>`;
  }

  /* ---- Log ---- */
  const recentHTML = state.log.slice(0,5).map(l=>`<div class="recent-item">${l}</div>`).join('');
  const fullLogHTML = state.showFullLog
    ? `<div class="full-log">${state.log.map(l=>`<div class="entry">${l}</div>`).join('')}</div>`
    : '';

  /* ---- Turn banner ---- */
  const turnBannerHTML = `<div class="turn-banner ${state.turn}">
      <div class="tb-who">${state.gameOver ? '\ud83c\udfc1 Game Over' : (state.turn==='human' ? '\u25b6 Your Turn' : `\u25b6 ${a.name}'s Turn`)}</div>
      <div class="tb-last">${state.log[0] || ''}</div>
    </div>`;

  /* ---- Spotlight ---- */
  const sp = state.spotlight;
  const spotCardHTML = sp.cardRank ? cardHTML({rank:sp.cardRank}, {size:'large'}) : `<div class="card large back"><span>?</span></div>`;
  const stages = ['played','resolving','result'];
  const stageIdx = stages.indexOf(sp.stage);
  const stagesHTML = stages.map((s,i)=>{
    const cls = i===stageIdx ? 'active' : (i<stageIdx ? 'done' : '');
    return `<span class="spot-stage ${cls}">${s}</span>`;
  }).join('');
  const spotlightHTML = `<div class="spotlight">
      <div class="spot-card">${spotCardHTML}</div>
      <div class="spot-body">
        <div class="spot-actor">${sp.actorName ? sp.actorName : 'The Court'}</div>
        <div class="spot-text">${sp.stageText}</div>
        ${sp.cardRank ? `<div class="spot-stages">${stagesHTML}</div>` : ''}
      </div>
    </div>`;

  /* ---- Codex: rank reference + rule book ---- */
  const refHTML = `<div class="ref-list">` + Object.keys(CARD_DEFS).sort((x,y)=>y-x).map(r=>{
    const d=CARD_DEFS[r];
    return `<div class="ref-item" style="--accent:${d.accent}"><div class="r">${d.icon}<br>${r}</div><div class="t"><b>${d.name}</b> \u2014 ${d.tag}<span>${d.desc}</span></div></div>`;
  }).join('') + `<div class="ref-item" style="--accent:${SANCTUARY_DEF.accent}"><div class="r">${SANCTUARY_DEF.icon}<br>\u00b7</div><div class="t"><b>Sanctuary</b> \u2014 hidden aside card<span>${SANCTUARY_DEF.desc}</span></div></div></div>`;

  const rulebookHTML = `<div class="rulebook">
    <h4>Setup</h4>
    <p>The deck holds <b>18 letters</b>: ranks 1\u20138 have two copies each, and ranks 9 (The Regent) and 10 (The Exiled Heir) have one copy each. Each player is dealt <b>one hidden letter</b> to start. One further letter is set aside, unseen by anyone, as the <b>Sanctuary card</b> \u2014 it only comes into play through the Exiled Heir's reincarnation. Everything else becomes the draw pile, called the <b>case</b>.</p>
    <h4>The Turn Structure</h4>
    <p>Every turn follows the same order: <b>Draw \u2192 Choose \u2192 Play \u2192 Resolve \u2192 Next player.</b> You draw one letter from the case (now holding two), choose one of your two letters to play, its ability resolves, and it's discarded face-up to your discard pile.</p>
    <h4>Targeting</h4>
    <p>With only two players, any ability that "targets a player" always targets your opponent \u2014 there's no choice to make about who.</p>
    <h4>The Warden's Protection</h4>
    <p>Playing The Warden makes you immune to <b>any targeted effect</b> from your opponent until your own next turn begins. A protected player simply can't be targeted \u2014 the attacking card is still played and discarded, but its effect fizzles with no result.</p>
    <h4>What Actually Eliminates You</h4>
    <p>Most forced discards do <b>not</b> eliminate anyone \u2014 they just change which letter you're left holding. Only two abilities eliminate a player directly: a lost <b>Formal Duel</b> (The Blade Marshal) and a correct rank guess from <b>Whispered Accusation</b> (The Informant).</p>
    <h4>The Exiled Heir</h4>
    <p>The Exiled Heir (rank 10) can never be played voluntarily \u2014 if it's in your hand, you must play your other letter. If The Plague Doctor's Quarantine forces you to discard it, <b>reincarnation</b> triggers instead: the Heir slips away and you draw the Sanctuary card in its place, remaining safely in the game. The Regent's Trial \u2014 whether played directly or triggered by the second Herald \u2014 is the one exception: if the Trial chooses to discard the Heir, it is genuinely removed with no reincarnation.</p>
    <h4>The Herald's Uprising</h4>
    <p>The first Herald played each game does nothing. The moment the second copy is played, by either player, the player who played it immediately carries out a full Regent's Trial against their opponent.</p>
    <h4>The Sealed Record</h4>
    <p>Playing The Archivist doesn't do anything immediately \u2014 it flags a bonus for your <b>next</b> turn. On that turn, instead of drawing one letter, you draw three, keep one, and return the other two to the top of the case. If you're eliminated before that turn comes around, the bonus is simply lost.</p>
    <h4>End of the Game</h4>
    <p>The game ends the instant only one player remains \u2014 they win immediately. If instead the case runs empty before that happens, the round ends there: both remaining players reveal their final letter, and the <b>higher rank wins</b>. A tie in rank is a draw.</p>
  </div>`;

  const codexBodyHTML = state.codexTab==='ref' ? refHTML : rulebookHTML;

  app.innerHTML = `
    <div class="header">
      <h1>The Empty Throne</h1>
      <div class="sub">a court-intrigue card game &middot; 2 players</div>
    </div>
    <div class="flourish"><span class="line"></span><span class="gem">\u2726</span><span class="line"></span></div>
    ${turnBannerHTML}
    ${spotlightHTML}
    <div class="layout">
      <div class="board">
        <div class="zone">
          <div class="zone-title"><span class="name">${a.name}</span><span class="status">${a.hand.length} card(s)${a.protected?'<span class="shield-badge">Guarded</span>':''}</span></div>
          <div class="hand">${aiHandHTML}</div>
          <div class="discard-section"><div class="discard-box"><div class="discard-header">Opponent Discard Pile</div>${discardBoxHTML(state.discardPiles.ai)}</div></div>
        </div>
        <div class="center-row">
          <div class="pile"><div class="big">${state.deck.length}</div><div class="label">Letters in the case</div></div>
        </div>
        <div class="zone">
          <div class="zone-title"><span class="name">${h.name}</span><span class="status">${h.hand.length} card(s)${h.protected?'<span class="shield-badge">Guarded</span>':''}</span></div>
          <div class="hand">${humanHandHTML}</div>
          <div class="discard-section"><div class="discard-box"><div class="discard-header">My Discard Pile</div>${discardBoxHTML(state.discardPiles.human)}</div></div>
        </div>
        <div class="action-panel">${actionHTML}</div>
      </div>
      <div class="sidebar">
        <div class="log-box">
          <div class="log-title">Court Record</div>
          <div class="recent-list">${recentHTML}</div>
          <button class="btn" onclick="toggleLog()" style="margin-top:8px; width:100%;">${state.showFullLog?'Hide':'Show'} full record</button>
          ${fullLogHTML}
        </div>
        <div class="zone">
          <div class="codex-tabs">
            <div class="codex-tab ${state.codexTab==='ref'?'active':''}" onclick="setCodexTab('ref')">Rank Reference</div>
            <div class="codex-tab ${state.codexTab==='rules'?'active':''}" onclick="setCodexTab('rules')">Rule Book</div>
          </div>
          ${codexBodyHTML}
        </div>
      </div>
    </div>
    <div class="note">Draw \u2192 Choose a card \u2192 Play it \u2192 Resolve its ability \u2192 Next player. Original game, original terms \u2014 placeholder art, mechanics-first prototype.</div>
